---
- name: Create /srv/scripts directory
  ansible.builtin.file:
    path: /srv/scripts
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create /srv/data directory
  ansible.builtin.file:
    path: /srv/data
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create /srv/data/pvduck directory
  ansible.builtin.file:
    path: /srv/data/pvduck
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create /srv/data/bookbear directory
  ansible.builtin.file:
    path: /srv/data/bookbear
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create /srv/config directory
  ansible.builtin.file:
    path: /srv/config
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create /srv/config/pvduck directory
  ansible.builtin.file:
    path: /srv/config/pvduck
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy pvduck wiki config
  ansible.builtin.copy:
    src: pvduck/wiki.yml
    dest: /srv/config/pvduck/wiki.yml
    owner: root
    group: root
    mode: '0644'

- name: Deploy sync-pvduck script
  ansible.builtin.copy:
    src: sync-pvduck.sh
    dest: /srv/scripts/sync-pvduck.sh
    owner: root
    group: root
    mode: '0755'

- name: Schedule nightly pvduck sync
  ansible.builtin.cron:
    name: sync-pvduck
    hour: '2'
    minute: '0'
    job: /srv/scripts/sync-pvduck.sh
